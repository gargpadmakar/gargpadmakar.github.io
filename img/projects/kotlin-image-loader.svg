<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLoader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="100%" stop-color="#141126" />
    </linearGradient>
    <linearGradient id="glowLoader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="mtnGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="mtnGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.5" />
    </linearGradient>
    <filter id="blurLoader"><feGaussianBlur stdDeviation="36" /></filter>
    <clipPath id="imgClip">
      <rect x="-60" y="-45" width="120" height="90" rx="10" />
    </clipPath>
  </defs>

  <rect width="800" height="420" fill="url(#bgLoader)" />

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.035)" stroke-width="1">
    <line x1="0" y1="70" x2="800" y2="70" /><line x1="0" y1="140" x2="800" y2="140" /><line x1="0" y1="210" x2="800" y2="210" /><line x1="0" y1="280" x2="800" y2="280" /><line x1="0" y1="350" x2="800" y2="350" />
    <line x1="160" y1="0" x2="160" y2="420" /><line x1="320" y1="0" x2="320" y2="420" /><line x1="480" y1="0" x2="480" y2="420" /><line x1="640" y1="0" x2="640" y2="420" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="400" cy="170" r="140" fill="#a855f7" opacity="0.15" filter="url(#blurLoader)" />
  <circle cx="470" cy="185" r="120" fill="#06b6d4" opacity="0.12" filter="url(#blurLoader)" />

  <!-- Center Image Loading & Caching Graphic -->
  <g transform="translate(400, 160)">
    <!-- Cache Stack Layer 3 (Bottom Disk Cache) -->
    <g transform="translate(0, 42)">
      <rect x="-72" y="-12" width="144" height="24" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(148,163,184,0.25)" stroke-width="1.5" />
      <circle cx="-52" cy="0" r="4" fill="#64748b" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">DISK CACHE &#8226; OKHTTP</text>
    </g>

    <!-- Cache Stack Layer 2 (Middle LRU Memory Cache) -->
    <g transform="translate(0, 22)">
      <rect x="-80" y="-14" width="160" height="28" rx="10" fill="rgba(24,19,45,0.9)" stroke="rgba(168,85,247,0.4)" stroke-width="1.5" />
      <circle cx="-60" cy="0" r="4.5" fill="#a855f7" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="1">LRU MEMORY CACHE (HEAP)</text>
    </g>

    <!-- Center Main Image Frame (Canvas) -->
    <g transform="translate(0, -32)">
      <!-- Outer Frame Shadow / Glow -->
      <rect x="-68" y="-52" width="136" height="104" rx="16" fill="rgba(15,23,42,0.95)" stroke="url(#glowLoader)" stroke-width="2.5" />
      
      <!-- Inner Clipped Image Content -->
      <g clip-path="url(#imgClip)">
        <rect x="-60" y="-45" width="120" height="90" fill="#090d16" />
        <!-- Sun / Light Source -->
        <circle cx="34" cy="-20" r="14" fill="url(#sunGrad)" />
        <!-- Mountains / Wave Art -->
        <polygon points="-60,45 -25,-5 15,45" fill="url(#mtnGrad1)" />
        <polygon points="-10,45 25,5 65,45" fill="url(#mtnGrad2)" />
        <polygon points="10,45 42,18 60,45" fill="#38bdf8" opacity="0.6" />
      </g>

      <!-- Corner Accent Dots -->
      <circle cx="-54" cy="-38" r="3" fill="#38bdf8" />
      <circle cx="54" cy="-38" r="3" fill="#a855f7" />
      <circle cx="-54" cy="38" r="3" fill="#ec4899" />
      <circle cx="54" cy="38" r="3" fill="#10b981" />
    </g>

    <!-- Floating Badge Left: Compose AsyncImage -->
    <g transform="translate(-140, -25)">
      <rect x="-56" y="-16" width="112" height="32" rx="16" fill="rgba(15,23,42,0.85)" stroke="rgba(56,189,248,0.4)" stroke-width="1.5" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">AsyncImage</text>
    </g>

    <!-- Floating Badge Right: View loadImage -->
    <g transform="translate(140, -25)">
      <rect x="-56" y="-16" width="112" height="32" rx="16" fill="rgba(15,23,42,0.85)" stroke="rgba(168,85,247,0.4)" stroke-width="1.5" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="0.5">ImageView</text>
    </g>
  </g>

  <!-- Title & Typography -->
  <text x="400" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">KotlinImageLoader</text>
  <text x="400" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">MODULAR ANDROID IMAGE LOADING &#8226; CLEAN ARCHITECTURE &#8226; MVI</text>

  <!-- Tags Pill Row at Bottom -->
  <g transform="translate(400, 385)">
    <rect x="-190" y="-12" width="380" height="24" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="1">COMPOSE &#8226; RECYCLERVIEW &#8226; LRU CACHE &#8226; DOWN-SAMPLING</text>
  </g>
</svg>
