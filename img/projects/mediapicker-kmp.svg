<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKmp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="100%" stop-color="#12182b" />
    </linearGradient>
    <linearGradient id="glowKmp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="camGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="blurKmp"><feGaussianBlur stdDeviation="32" /></filter>
  </defs>
  <rect width="800" height="420" fill="url(#bgKmp)" />
  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.035)" stroke-width="1">
    <line x1="0" y1="70" x2="800" y2="70" /><line x1="0" y1="140" x2="800" y2="140" /><line x1="0" y1="210" x2="800" y2="210" /><line x1="0" y1="280" x2="800" y2="280" /><line x1="0" y1="350" x2="800" y2="350" />
    <line x1="160" y1="0" x2="160" y2="420" /><line x1="320" y1="0" x2="320" y2="420" /><line x1="480" y1="0" x2="480" y2="420" /><line x1="640" y1="0" x2="640" y2="420" />
  </g>
  <!-- Glow backdrop -->
  <circle cx="400" cy="175" r="130" fill="#06b6d4" opacity="0.12" filter="url(#blurKmp)" />
  <circle cx="480" cy="190" r="110" fill="#a855f7" opacity="0.10" filter="url(#blurKmp)" />

  <!-- Media & Camera Visuals -->
  <g transform="translate(400, 165)">
    <!-- Back photo frame tilted left -->
    <g transform="rotate(-9) translate(-75, -20)">
      <rect x="-42" y="-32" width="84" height="64" rx="8" fill="rgba(30,41,59,0.7)" stroke="rgba(148,163,184,0.3)" stroke-width="2" />
      <circle cx="-18" cy="-10" r="6" fill="#38bdf8" opacity="0.8" />
      <polygon points="-30,16 -6,-6 14,16" fill="rgba(56,189,248,0.4)" />
      <polygon points="2,16 18,2 34,16" fill="rgba(99,102,241,0.5)" />
    </g>
    <!-- Back photo frame tilted right -->
    <g transform="rotate(11) translate(75, -15)">
      <rect x="-42" y="-32" width="84" height="64" rx="8" fill="rgba(30,41,59,0.7)" stroke="rgba(148,163,184,0.3)" stroke-width="2" />
      <circle cx="-16" cy="-10" r="6" fill="#c084fc" opacity="0.8" />
      <polygon points="-28,16 -4,-4 16,16" fill="rgba(192,132,252,0.4)" />
      <polygon points="6,16 22,4 36,16" fill="rgba(59,130,246,0.5)" />
    </g>
    <!-- Center Main Camera / Multiplatform Device Badge -->
    <rect x="-65" y="-48" width="130" height="96" rx="18" fill="rgba(15,23,42,0.9)" stroke="url(#glowKmp)" stroke-width="2.5" />
    <!-- Camera lens ring -->
    <circle cx="0" cy="4" r="28" fill="rgba(30,41,59,0.8)" stroke="url(#camGrad)" stroke-width="2.5" />
    <circle cx="0" cy="4" r="18" fill="#0f172a" stroke="rgba(56,189,248,0.5)" stroke-width="1.5" />
    <circle cx="7" cy="-2" r="5" fill="#38bdf8" opacity="0.9" />
    <!-- Camera flash and sensor -->
    <circle cx="-42" cy="-28" r="4.5" fill="#38bdf8" />
    <rect x="26" y="-32" width="18" height="6" rx="3" fill="rgba(148,163,184,0.5)" />
    <!-- KMP Cross-Platform Indicator Pill at bottom -->
    <g transform="translate(0, 48)">
      <rect x="-56" y="-12" width="112" height="24" rx="12" fill="#0f172a" stroke="url(#glowKmp)" stroke-width="1.5" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">ANDROID • iOS</text>
    </g>
  </g>

  <!-- Title & Typography -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <!-- Top badge -->
    <rect x="255" y="38" width="290" height="28" rx="14" fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.3)" />
    <text x="400" y="56" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="1.6">KOTLIN MULTIPLATFORM LIBRARY</text>
    <text x="400" y="295" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="-0.5">MediaPickerKMP</text>
    <text x="400" y="325" fill="#94a3b8" font-size="13.5" font-weight="500">Unified Image, Video &amp; Camera Picker for Compose Multiplatform (Android &amp; iOS)</text>
  </g>

  <!-- Tags at bottom -->
  <g font-family="'JetBrains Mono', -apple-system, monospace" font-size="11" fill="#38bdf8">
    <rect x="180" y="355" width="130" height="25" rx="6" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.22)" />
    <text x="245" y="371" text-anchor="middle">Kotlin Multiplatform</text>
    <rect x="325" y="355" width="150" height="25" rx="6" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.22)" />
    <text x="400" y="371" text-anchor="middle">Compose Multiplatform</text>
    <rect x="490" y="355" width="130" height="25" rx="6" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.22)" />
    <text x="555" y="371" text-anchor="middle" fill="#c084fc">Android &amp; iOS</text>
  </g>
</svg>
