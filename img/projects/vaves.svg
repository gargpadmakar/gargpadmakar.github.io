    <rect x="330" y="355" width="140" height="24" rx="6" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.2)" />
    <text x="400" y="371" text-anchor="middle">WebRTC LiveKit</text>
    <rect x="490" y="355" width="130" height="24" rx="6" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.2)" />
