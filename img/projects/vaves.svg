<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_vaves" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091122" />
      <stop offset="100%" stop-color="#14213d" />
    </linearGradient>
    <linearGradient id="glow_vaves" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="blur_vaves"><feGaussianBlur stdDeviation="30" /></filter>
  </defs>
  <rect width="800" height="420" fill="url(#bg_vaves)" />
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="70" x2="800" y2="70" /><line x1="0" y1="140" x2="800" y2="140" /><line x1="0" y1="210" x2="800" y2="210" /><line x1="0" y1="280" x2="800" y2="280" /><line x1="0" y1="350" x2="800" y2="350" />
    <line x1="160" y1="0" x2="160" y2="420" /><line x1="320" y1="0" x2="320" y2="420" /><line x1="480" y1="0" x2="480" y2="420" /><line x1="640" y1="0" x2="640" y2="420" />
  </g>
  <circle cx="400" cy="175" r="130" fill="#38bdf8" opacity="0.12" filter="url(#blur_vaves)" />
  <!-- Wave / Communication Audio Frequency Visual -->
  <g transform="translate(400, 160)" stroke="url(#glow_vaves)" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-90 0 Q -65 -45, -45 0 T 0 0 T 45 0 T 90 0" stroke-width="3.5" />
    <path d="M-70 0 Q -50 30, -35 0 T 0 0 T 35 0 T 70 0" stroke-width="2" opacity="0.6" />
    <circle cx="0" cy="0" r="8" fill="#38bdf8" />
    <circle cx="-45" cy="0" r="5" fill="#818cf8" />
    <circle cx="45" cy="0" r="5" fill="#818cf8" />
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <rect x="250" y="38" width="300" height="28" rx="14" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" />
    <text x="400" y="56" fill="#38bdf8" font-size="12" font-weight="600" letter-spacing="1.5">REAL-TIME CALLING &amp; MESSAGING</text>
    <text x="400" y="295" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.5">Vaves - Communication App</text>
    <text x="400" y="325" fill="#94a3b8" font-size="13" font-weight="500">LiveKit WebRTC • VoIP Audio/Video • Encrypted Chat</text>
  </g>
